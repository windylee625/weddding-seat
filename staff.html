<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>位卡擺放圖｜Harry & Windy</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root { --oat: #d8ccb6; --oat-soft: #e9e1d2; --cocoa: #583217; --cocoa-soft: #8a6a53; --paper: #f6f3ec; --card: #fffdf9; --line: #cdbfa6; --child: #e3b7ae; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--cocoa); line-height: 1.6;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
.wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 60px; }
.top h1 { font-size: 24px; margin: 0; letter-spacing: .1em; }
.top .sub { color: var(--cocoa-soft); font-size: 14px; margin: 2px 0 10px; }
.howto { background: var(--card); border: 1px solid var(--oat); border-radius: 14px; padding: 12px 16px; font-size: 15px; }
.howto ol { margin: 4px 0; padding-left: 1.3em; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 6px; }
.tools button { font: inherit; font-size: 15px; color: var(--paper); background: var(--cocoa); border: 0; border-radius: 999px; padding: 9px 20px; min-height: 44px; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.chips a { display: inline-block; min-width: 44px; text-align: center; padding: 8px 10px; border-radius: 10px; text-decoration: none;
  color: var(--cocoa); background: var(--card); border: 1.5px solid var(--line); font-weight: 600; }
.chips a.free { background: transparent; border-style: dashed; color: var(--cocoa-soft); font-weight: 400; }

.sheet { background: var(--card); border: 1px solid var(--oat); border-radius: 16px; padding: 18px; margin-top: 18px; scroll-margin-top: 12px; }
.head { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; }
.head h2 { margin: 0; font-size: 34px; letter-spacing: .06em; line-height: 1.2; }
.head .tname { font-size: 18px; color: var(--cocoa-soft); margin-top: 2px; }
.head .count { font-size: 14px; color: var(--cocoa-soft); margin-top: 4px; }
.head .mini { flex: none; width: 128px; }
.head .mini svg { width: 100%; height: auto; display: block; }
.round { display: block; width: 100%; max-width: 560px; height: auto; margin: 6px auto 0; }
.note { margin: 18px 0 6px; padding: 18px 20px; border-radius: 14px; background: var(--oat-soft); font-size: 20px; line-height: 1.7; }
.note b { display: block; font-size: 24px; }
.list { list-style: none; padding: 0; margin: 10px 0 0; columns: 2; column-gap: 24px; font-size: 17px; }
.list li { break-inside: avoid; display: flex; gap: 10px; align-items: center; padding: 4px 0; border-bottom: 1px dotted var(--line); }
.list .n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--cocoa); color: var(--paper);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
.list .tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--child); }
.list .empty { color: var(--cocoa-soft); }

svg text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: var(--cocoa); }
svg .en-t { font-family: Georgia, serif; }
.plan .tbl circle { fill: var(--oat-soft); stroke: var(--line); stroke-width: 1.2; }
.plan .tbl text { font-size: 15px; text-anchor: middle; dominant-baseline: central; }
.plan .tbl.on circle.body { fill: var(--cocoa); stroke: #2f1a0a; stroke-width: 2.5; }
.plan .tbl.on text { fill: var(--paper); font-weight: 700; }
.plan .tbl .ring { display: none; }

@media (max-width: 520px) {
  .head h2 { font-size: 28px; }
  .head .mini { width: 96px; }
  .list { columns: 1; }
}
@page { size: A4 portrait; margin: 12mm; }
@media print {
  body { background: #fff; }
  .wrap { max-width: none; padding: 0; }
  .top, .howto, .tools, .chips { display: none; }
  .sheet { border: 0; border-radius: 0; padding: 0; margin: 0; break-after: page; page-break-after: always; }
  .sheet:last-child { break-after: auto; page-break-after: auto; }
  .round { max-width: 165mm; }
  .head .mini { width: 34mm; }
  .note { border: 1px solid var(--line); }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>位卡擺放圖</h1>
    <p class="sub">Harry &amp; Windy 婚宴．2026.11.07．豪華宴會廳</p>
  </div>
  <div class="howto">
    <ol>
      <li>每張圖的<b>上方是舞台方向</b>，座位 1 在最靠近舞台的正中位置，之後<b>順時針</b>依序排列。</li>
      <li>圓圈內的數字是座位順序，外圈是位卡上的名字，請將位卡放在對應的座位上。</li>
      <li>粉色座位為<b>兒童座椅</b>；虛線為空位。</li>
      <li>主桌與家人桌<b>不放位卡</b>，賓客自由入座。</li>
    </ol>
  </div>
  <div class="tools"><button type="button" onclick="window.print()">列印（每頁一桌）</button><span class="sub" id="updated"></span></div>
  <nav class="chips" id="chips" aria-label="跳到指定桌"></nav>
  <div id="sheets"></div>
</div>

<script src="seats.js"></script>
<script src="shared.js"></script>
<script>
const TABLES = buildTables(window.SEATING).filter(t => t.x != null || t.slots.length);
const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function anchor(t) { return 't-' + encodeURIComponent(t.id); }

// 大圓桌：座位順序在內圈、位卡名字在外圈
function roundChart(t) {
  const W = 640, H = 640, cx = 320, cy = 334, R1 = 166, R2 = 232;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'round', role: 'img', 'aria-label': tableLabel(t) + '位卡擺放圖' });
  svg.appendChild(svgEl('text', { x: cx, y: 24, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 700, 'letter-spacing': 3 }, '▲ 舞台方向'));
  svg.appendChild(svgEl('circle', { cx, cy, r: 120, fill: '#e9e1d2', stroke: '#cdbfa6', 'stroke-width': 2 }));
  svg.appendChild(svgEl('text', { x: cx, y: hasTableName(t) ? cy - 8 : cy + 12, 'text-anchor': 'middle', 'font-size': 40, 'font-weight': 700 }, tableLabel(t)));
  if (hasTableName(t)) {
    const size = Math.min(20, Math.floor(200 / Math.max(1, textWidth(t.name, 1))));
    svg.appendChild(svgEl('text', { x: cx, y: cy + 28, 'text-anchor': 'middle', 'font-size': size, style: 'fill:#8a6a53' }, t.name));
  }
  for (let i = 0; i < t.seats; i++) {
    const a = seatAngle(t, i), sin = Math.sin(a), cos = Math.cos(a);
    const s = t.slots[i];
    const x1 = cx + R1 * sin, y1 = cy - R1 * cos, x2 = cx + R2 * sin, y2 = cy - R2 * cos;
    svg.appendChild(svgEl('line', { x1: cx + 124 * sin, y1: cy - 124 * cos, x2: x2, y2: y2, stroke: '#e9e1d2', 'stroke-width': 2 }));
    svg.appendChild(svgEl('circle', { cx: x1, cy: y1, r: 17, fill: s ? '#583217' : '#fff', stroke: '#583217', 'stroke-width': 2, 'stroke-dasharray': s ? 'none' : '4 3' }));
    svg.appendChild(svgEl('text', { x: x1, y: y1, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 16, 'font-weight': 700, style: 'fill:' + (s ? '#f6f3ec' : '#583217') }, i + 1));
    const text = s ? s.card : '空位';
    const fs = textWidth(text, 22) > 120 ? 18 : 22;
    const w = Math.max(64, textWidth(text, fs) + 24), h = s && s.child ? 58 : 42;
    svg.appendChild(svgEl('rect', { x: x2 - w / 2, y: y2 - h / 2, width: w, height: h, rx: 12,
      fill: !s ? '#fff' : s.child ? '#e3b7ae' : '#fffdf9', stroke: '#583217', 'stroke-width': s ? 2 : 1.5, 'stroke-dasharray': s ? 'none' : '5 4' }));
    svg.appendChild(svgEl('text', { x: x2, y: s && s.child ? y2 - 8 : y2, 'text-anchor': 'middle', 'dominant-baseline': 'central',
      'font-size': fs, 'font-weight': s ? 700 : 400, style: s ? '' : 'fill:#8a6a53' }, text));
    if (s && s.child) svg.appendChild(svgEl('text', { x: x2, y: y2 + 15, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 13 }, '兒童座椅'));
  }
  return svg;
}

function freeNote(t) {
  if (t.id === '主桌') return '<b>主桌：不放位卡</b>新郎、新娘坐在靠舞台的正中位置（12 點方向），其餘賓客自由入座。';
  if (!t.slots.length) return '<b>本桌目前沒有名單</b>不需放位卡。';
  return '<b>家人桌：不放位卡</b>賓客自由入座。';
}

function render() {
  $('chips').innerHTML = TABLES.map(t =>
    '<a href="#' + anchor(t) + '"' + (t.free || !t.slots.length ? ' class="free"' : '') + '>' + esc(t.id) + '</a>').join('');
  const box = $('sheets');
  TABLES.forEach(t => {
    const sec = document.createElement('section');
    sec.className = 'sheet';
    sec.id = anchor(t);
    const people = t.slots.filter(Boolean).length;
    const withCards = !t.free && people > 0;
    sec.innerHTML = '<div class="head"><div><h2>' + esc(tableLabel(t)) + '</h2>' +
      (hasTableName(t) ? '<div class="tname">' + esc(t.name) + '</div>' : '') +
      '<div class="count">' + (withCards ? '位卡 ' + people + ' 張．座位 ' + t.seats + ' 位' : people ? '共 ' + people + ' 位賓客' : '') + '</div></div>' +
      '<div class="mini"></div></div>';
    if (t.x != null) sec.querySelector('.mini').appendChild(drawPlan(TABLES, t.id));
    if (withCards) {
      sec.appendChild(roundChart(t));
      const ul = document.createElement('ul');
      ul.className = 'list';
      ul.innerHTML = Array.from({ length: t.seats }, (_, i) => {
        const s = t.slots[i];
        return '<li><span class="n">' + (i + 1) + '</span>' +
          (s ? '<span>' + esc(s.card) + '</span>' + (s.child ? '<span class="tag">兒童座椅</span>' : '') : '<span class="empty">空位</span>') + '</li>';
      }).join('');
      sec.appendChild(ul);
    } else {
      const note = document.createElement('div');
      note.className = 'note';
      note.innerHTML = freeNote(t);
      sec.appendChild(note);
    }
    box.appendChild(sec);
  });
  const d = new Date(window.SEATING && window.SEATING.updated);
  if (!isNaN(d)) $('updated').textContent = '座位資料更新：' + d.toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
}

if (!window.SEATING) $('sheets').innerHTML = '<div class="note">座位資料載入失敗，請連上網路後重新整理。</div>';
else render();
</script>
</body>
</html>
