<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="Harry & Windy 座位查詢">
<meta property="og:description" content="2026.11.07 婚宴座位查詢，輸入姓名即可找到您的桌號與座位。">

<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
:root {
  --oat: #d8ccb6;
  --oat-soft: #e9e1d2;
  --cocoa: #583217;
  --cocoa-soft: #8a6a53;
  --paper: #f6f3ec;
  --card: #fffdf9;
  --line: #cdbfa6;
  --child: #e3b7ae; /* 兒童座椅：喜帖 dress code 的粉色 */
  --serif-en: "Cormorant Garamond", "Didot", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
  --serif-tc: "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif;
  --sans-tc: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--cocoa);
  font-family: var(--sans-tc);
  line-height: 1.6;
  min-height: 100vh;
}
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px calc(32px + env(safe-area-inset-bottom)); }

/* 頁首：對齊喜帖封面 */
header {
  background: var(--oat);
  text-align: center;
  padding: calc(28px + env(safe-area-inset-top)) 16px 30px;
  border-radius: 0 0 48% 48% / 0 0 34px 34px;
}
.dots { font-family: var(--serif-en); letter-spacing: .28em; font-size: 14px; }
.names {
  font-family: var(--serif-en);
  font-size: clamp(34px, 11vw, 46px);
  line-height: 1.02;
  letter-spacing: .06em;
  margin: 8px 0;
  font-weight: 500;
}
.sub { margin-top: 14px; font-family: var(--serif-tc); letter-spacing: .4em; font-size: 15px; padding-left: .4em; }
.sub small { display: block; font-family: var(--serif-en); letter-spacing: .32em; font-size: 11px; margin-top: 2px; opacity: .8; }

/* 搜尋 */
.search { margin-top: 22px; }
.search label { display: block; font-family: var(--serif-tc); letter-spacing: .12em; font-size: 15px; margin-bottom: 8px; }
.field { display: flex; gap: 8px; }
.field input {
  flex: 1; min-width: 0;
  font: inherit; font-size: 18px; /* ≥16px 避免 iOS 自動放大 */
  color: var(--cocoa);
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 999px;
  padding: 13px 20px;
  outline: none;
  -webkit-appearance: none; appearance: none;
}
.field input::placeholder { color: #b3a48f; }
.field input:focus { border-color: var(--cocoa); box-shadow: 0 0 0 3px rgba(88, 50, 23, .12); }
.field button {
  font: inherit; font-size: 16px; letter-spacing: .2em; padding: 0 20px 0 24px;
  min-height: 52px;
  color: var(--paper); background: var(--cocoa);
  border: 0; border-radius: 999px; cursor: pointer;
}
.field button:active { transform: scale(.97); }
.hint { font-size: 13px; color: var(--cocoa-soft); margin: 8px 6px 0; }

.msg {
  margin-top: 18px; padding: 16px 18px; border-radius: 16px;
  background: var(--oat-soft); text-align: center; font-size: 15px;
}
.picks { margin-top: 18px; }
.picks p { margin: 0 4px 8px; font-size: 14px; color: var(--cocoa-soft); }
.pick {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  width: 100%; text-align: left;
  font: inherit; font-size: 17px; color: var(--cocoa);
  background: var(--card); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 13px 16px; margin-bottom: 8px; cursor: pointer; min-height: 52px;
}
.pick:active { background: var(--oat-soft); }
.pick small { font-size: 13px; color: var(--cocoa-soft); margin-left: 6px; }
.pick span:last-child { flex: none; font-size: 13px; color: var(--cocoa-soft); text-align: right; }

/* 查詢結果 */
.ticket {
  margin-top: 20px; background: var(--cocoa); color: var(--paper);
  border-radius: 20px; padding: 22px 20px; text-align: center;
}
.ticket .who { font-family: var(--serif-tc); font-size: 17px; letter-spacing: .08em; overflow-wrap: anywhere; }
.ticket .no { font-family: var(--serif-en); font-size: 60px; line-height: 1.05; margin: 4px 0 2px; letter-spacing: .04em; }
.ticket .no.zh { font-family: var(--serif-tc); font-size: 46px; letter-spacing: .2em; padding-left: .2em; margin: 10px 0 8px; }
.ticket .tname { font-size: 15px; color: var(--oat); letter-spacing: .12em; }
.ticket .cap { font-family: var(--serif-en); font-size: 11px; letter-spacing: .34em; color: var(--oat); }
.ticket .free { margin-top: 14px; padding: 10px 14px; border-radius: 12px; background: rgba(216, 204, 182, .18); color: var(--paper); font-size: 15px; letter-spacing: .08em; }

section.card {
  margin-top: 16px; background: var(--card); border: 1px solid var(--oat);
  border-radius: 20px; padding: 18px 12px 12px;
}
section.card h2 {
  margin: 0 0 2px; text-align: center; font-family: var(--serif-tc);
  font-size: 16px; font-weight: 600; letter-spacing: .3em; padding-left: .3em;
}
section.card .en { text-align: center; font-family: var(--serif-en); font-size: 11px; letter-spacing: .3em; color: var(--cocoa-soft); }
section.card svg { display: block; width: 100%; height: auto; margin-top: 6px; }
#seatCard svg { max-width: 420px; margin-left: auto; margin-right: auto; }
.legend { text-align: center; font-size: 12.5px; color: var(--cocoa-soft); margin: 4px 0 6px; }

/* 同行者名單 */
.party { list-style: none; margin: 4px 4px 10px; padding: 0; }
.party li {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 10px; border-top: 1px solid var(--oat-soft); font-size: 16px;
}
.party li:first-child { border-top: 0; }
.party .num {
  flex: none; width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--cocoa); color: var(--paper); border: 2px solid #2f1a0a;
  font-weight: 700; font-size: 15px;
}
.party .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.party li.child .num { background: var(--child); color: var(--cocoa); border-color: var(--cocoa); }
.party .tag {
  flex: none; font-size: 12px; padding: 2px 10px; border-radius: 999px;
  background: var(--child); color: var(--cocoa);
}

svg text { font-family: var(--sans-tc); fill: var(--cocoa); }
svg .en-t { font-family: var(--serif-en); }
.tbl circle { fill: var(--oat-soft); stroke: var(--line); stroke-width: 1.2; }
.tbl text { font-size: 15px; text-anchor: middle; dominant-baseline: central; }
.tbl.on circle.body { fill: var(--cocoa); stroke: #2f1a0a; stroke-width: 2.5; }
.tbl.on text { fill: var(--paper); font-weight: 700; }
.tbl .ring { fill: none; stroke: var(--cocoa); stroke-width: 2; opacity: 0; }
.tbl.on .ring { animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.tbl.also circle.body { fill: var(--oat); stroke: var(--cocoa); stroke-width: 2; }
.tbl.also text { font-weight: 700; }
.ticket .companions { margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(216, 204, 182, .35); text-align: left; }
.ticket .companions .cap { text-align: center; margin-bottom: 6px; }
.ticket .companions ul { list-style: none; margin: 0; padding: 0; }
.ticket .companions li { padding: 6px 2px; font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
.ticket .companions li + li { border-top: 1px dashed rgba(216, 204, 182, .3); }
.ticket .companions b { display: block; color: var(--oat); font-size: 13px; letter-spacing: .1em; }
@keyframes pulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.55); } }
@media (prefers-reduced-motion: reduce) { .tbl.on .ring { animation: none; opacity: .5; } }

footer { text-align: center; margin-top: 26px; font-family: var(--serif-en); letter-spacing: .3em; font-size: 12px; color: var(--cocoa-soft); }
#offline, #updated { display: block; margin-top: 8px; font-family: var(--sans-tc); letter-spacing: .05em; font-size: 12px; min-height: 1.6em; }
#updated { margin-top: 0; opacity: .75; }
.share { text-align: center; margin-top: 20px; }
.share button {
  font: inherit; font-size: 15px; letter-spacing: .15em; color: var(--cocoa);
  background: var(--oat); border: 0; border-radius: 999px; padding: 12px 28px; min-height: 48px; cursor: pointer;
}
.share button:active { transform: scale(.97); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="dots">• 2026 •</div>
  <div class="names">HARRY<br>WINDY</div>
  <div class="dots">• 1107 •</div>
  <div class="sub">賓客座位查詢<small>FIND YOUR SEAT</small></div>
</header>

<main class="wrap">
  <form class="search" id="form" autocomplete="off">
    <label for="q">請輸入您的姓名</label>
    <div class="field">
      <input id="q" type="search" inputmode="text" enterkeyhint="search" placeholder="例：王小明" aria-describedby="hint">
      <button type="submit">查詢</button>
    </div>
    <p class="hint" id="hint">輸入姓名的部分文字即可，同行親友的座位會一併顯示。</p>
  </form>

  <div id="out" aria-live="polite"></div>

  <section class="card" id="seatCard" hidden>
    <h2>您的座位</h2>
    <div class="en">YOUR SEAT</div>
    <div id="seat"></div>
    <ul class="party" id="party"></ul>
    <p class="legend">圖的上方為舞台方向，數字對應上方名單</p>
  </section>

  <section class="card">
    <h2>宴會廳平面圖</h2>
    <div class="en">FLOOR PLAN</div>
    <div id="plan"></div>
  </section>

  <div class="share"><button type="button" id="share">分享此頁面</button></div>

  <footer>WITH LOVE ALWAYS<span id="offline"></span><span id="updated"></span></footer>
</main>

<script>
// 每次開啟都加上時間參數，避免瀏覽器用暫存的舊座位資料（離線時由 sw.js 改用快取）
(function () { var v = Date.now(); document.write('<script src="seats.js?v=' + v + '"><\/script><script src="shared.js?v=' + v + '"><\/script>'); })();
</script>
<script>
/* 名單在 seats.js（用 admin.html 從 Excel 轉換更新），平面圖座標與資料解析在 shared.js */
const TABLES = buildTables(window.SEATING);
const NOT_FOUND = '找不到此姓名，請洽詢現場收禮桌工作人員';
const FREE_NOTE = '本桌不指定座位，請自由入座';
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ----- 搜尋 ----- */
const VARIANTS = { '温': '溫', '爲': '為', '臺': '台', '姐': '姊' };
function norm(s) {
  return String(s).normalize('NFKC').toLowerCase().replace(/[\s·•.,，。、]/g, '').replace(/[温爲臺姐]/g, c => VARIANTS[c]);
}
function stripParens(s) { return s.replace(/\(.*?\)/g, '').trim(); }

// 一筆 entry = 一組同行者（可跨桌；單獨出席者為 1 人一組）
const ENTRIES = buildGroups(TABLES).map(g => {
  const seats = g.members.map(({ t, i, seat: s }) => {
    const stripped = stripParens(s.name);
    const inner = (s.name.match(/\((.*?)\)/g) || []).map(p => p.slice(1, -1).trim()).filter(p => p !== '兒');
    const keys = [s.name, stripped, ...stripped.split(' '), ...inner, ...s.aliases, s.card].map(norm).filter(Boolean);
    return { t, i, label: s.label, child: s.child, keys: [...new Set(keys)] };
  });
  const tables = [...new Set(seats.map(s => s.t))];
  // 組名：有同行組代號就用代號，否則取最短的名字
  const head = g.code || seats.map(s => stripParens(s.label)).reduce((a, b) => (b.length < a.length ? b : a));
  return { seats, tables, head };
});

function entryTitle(e) { return e.seats.length === 1 ? e.seats[0].label : e.head; }

function search(raw) {
  const q = norm(raw);
  if (!q) return [];
  const forward = [], reverse = [];
  ENTRIES.forEach(e => {
    const keys = e.seats.flatMap(s => s.keys);
    let rank = 9;
    keys.forEach(k => {
      if (k === q) rank = Math.min(rank, 0);
      else if (k.startsWith(q)) rank = Math.min(rank, 1);
      else if (k.includes(q)) rank = Math.min(rank, 2);
    });
    if (rank < 9) forward.push({ e, rank });
    // 反向：輸入「林冠霖」也能找到座位表上的「冠霖」
    else if (keys.some(k => k.length >= 2 && q.includes(k))) reverse.push({ e, rank: 3 });
  });
  const hits = forward.length ? forward : reverse;
  return hits.sort((a, b) => a.rank - b.rank).map(h => h.e);
}

// 本人：組內最符合輸入文字的那一位（完全相同 > 開頭相同 > 包含）
function selfOf(entry) {
  const q = norm($('q').value);
  if (!q) return entry.seats[0];
  return entry.seats.find(s => s.keys.includes(q)) || entry.seats.find(s => s.keys.some(k => k.startsWith(q))) ||
    entry.seats.find(s => s.keys.some(k => k.includes(q))) || entry.seats[0];
}

/* ----- 平面圖 ----- */
// own：本人所在桌（深色），others：同行者所在的其他桌（淺色）
function highlightTables(own, others) {
  document.querySelectorAll('#plan .tbl').forEach(g => {
    const id = g.getAttribute('data-id');
    g.classList.toggle('on', id === own);
    g.classList.toggle('also', id !== own && (others || []).includes(id));
  });
}

/* ----- 圓桌座位圖 ----- */
function drawSeat(t, seats) {
  const W = 360, H = 336, cx = 180, cy = 176, R = 116;
  const sr = Math.min(21, Math.PI * R / t.seats * 0.78);
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
    'aria-label': `${tableLabel(t)}圓桌座位圖，座位為第 ${seats.map(s => s.i + 1).join('、')} 位` });

  svg.appendChild(svgEl('text', { x: cx, y: 16, 'text-anchor': 'middle', 'font-size': 11, 'letter-spacing': 2, style: 'fill:#8a6a53' }, '▲ 舞台方向'));
  svg.appendChild(svgEl('circle', { cx, cy, r: 74, fill: '#e9e1d2', stroke: '#cdbfa6', 'stroke-width': 1.5 }));
  svg.appendChild(svgEl('text', { x: cx, y: hasTableName(t) ? cy - 6 : cy + 9, 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 700, 'letter-spacing': 2 }, tableLabel(t)));
  if (hasTableName(t)) {
    const size = textWidth(t.name, 14) > 124 ? 12 : 14;
    svg.appendChild(svgEl('text', { x: cx, y: cy + 22, 'text-anchor': 'middle', 'font-size': size, style: 'fill:#8a6a53' }, t.name));
  }

  const mine = new Map(seats.map((s, n) => [s.i, { seat: s, n: n + 1 }]));
  for (let i = 0; i < t.seats; i++) {
    const a = seatAngle(t, i);
    const x = cx + R * Math.sin(a), y = cy - R * Math.cos(a);
    const m = mine.get(i);
    if (m) {
      // 本人與同行者：可可色；兒童座椅：粉色
      svg.appendChild(svgEl('circle', { cx: x, cy: y, r: sr + 2, fill: m.seat.child ? '#e3b7ae' : '#583217',
        stroke: m.seat.child ? '#583217' : '#2f1a0a', 'stroke-width': 3 }));
      svg.appendChild(svgEl('text', { x, y, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': Math.min(17, sr),
        'font-weight': 700, style: 'fill:' + (m.seat.child ? '#583217' : '#f6f3ec') }, m.n));
    } else {
      const empty = !t.slots[i];
      svg.appendChild(svgEl('circle', { cx: x, cy: y, r: sr, fill: empty ? 'none' : '#d8ccb6',
        stroke: '#cdbfa6', 'stroke-width': 1.5, 'stroke-dasharray': empty ? '4 4' : 'none' }));
    }
  }

  const box = $('seat');
  box.textContent = '';
  box.appendChild(svg);

  $('party').innerHTML = seats.map((s, n) =>
    '<li' + (s.child ? ' class="child"' : '') + '><span class="num">' + (n + 1) + '</span>' +
    '<span class="name">' + esc(s.label) + '</span>' +
    (s.child ? '<span class="tag">兒童座椅</span>' : '') + '</li>').join('');
}

/* ----- 畫面流程 ----- */
function clearResult() {
  $('seatCard').hidden = true;
  highlightTables(null);
}

function nameList(seats) {
  return seats.map(s => esc(s.label) + (s.child ? '（兒童座椅）' : '')).join('、');
}

// 大字顯示本人桌號；同行者依桌列在下方（同桌時，指定座位的桌由座位圖下方名單呈現）
function showEntry(entry, scroll) {
  const self = selfOf(entry);
  const t = self.t;
  const n = entry.seats.length;
  const main = t.id === '主桌';
  const lines = [];
  if (n > 1) {
    const same = entry.seats.filter(s => s.t === t && s !== self);
    if (same.length && t.free) lines.push('<li><b>同桌</b>' + nameList(same) + '</li>');
    entry.tables.filter(x => x !== t).forEach(x => {
      lines.push('<li><b>' + esc(tableLabel(x)) + (x.free ? '（自由入座）' : '') + '</b>' + nameList(entry.seats.filter(s => s.t === x)) + '</li>');
    });
  }
  $('out').innerHTML =
    '<div class="ticket" id="ticket">' +
      '<div class="who">' + esc(self.label) + (n > 1 ? '　一行 ' + n + ' 位' : '') + '</div>' +
      '<div class="cap" style="margin-top:10px">YOUR TABLE</div>' +
      (main ? '<div class="no zh">主桌</div>'
            : '<div class="no">' + esc(t.id) + '</div><div class="tname">第 ' + esc(t.id) + ' 桌' + (hasTableName(t) ? '｜' + esc(t.name) : '') + '</div>') +
      (t.free ? '<div class="free">' + FREE_NOTE + '</div>' : '') +
      (lines.length ? '<div class="companions"><div class="cap">同行親友</div><ul>' + lines.join('') + '</ul></div>' : '') +
    '</div>';
  if (t.free) $('seatCard').hidden = true;
  else { drawSeat(t, entry.seats.filter(s => s.t === t)); $('seatCard').hidden = false; }
  highlightTables(t.id, entry.tables.map(x => x.id));
  if (scroll) $('ticket').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function tablesText(e) {
  return e.tables.map(t => esc(tableLabel(t)) + (e.tables.length === 1 && hasTableName(t) ? '<br>' + esc(t.name) : '')).join('、');
}

function run(scroll) {
  const raw = $('q').value;
  clearResult();
  if (!norm(raw)) { $('out').textContent = ''; return; }
  const hits = search(raw);
  if (!hits.length) {
    $('out').innerHTML = '<div class="msg" role="alert">' + NOT_FOUND + '</div>';
    return;
  }
  if (hits.length === 1) { showEntry(hits[0], scroll); return; }
  const MAX = 30;
  const out = $('out');
  out.innerHTML = '<div class="picks"><p>找到 ' + hits.length + ' 筆相符的結果，請點選您的姓名：</p></div>';
  const list = out.firstChild;
  hits.slice(0, MAX).forEach(e => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pick';
    b.innerHTML = '<span>' + esc(entryTitle(e)) + (e.seats.length > 1 ? '<small>一行 ' + e.seats.length + ' 位</small>' : '') + '</span>' +
      '<span>' + tablesText(e) + '</span>';
    b.addEventListener('click', () => showEntry(e, true));
    list.appendChild(b);
  });
  if (hits.length > MAX) {
    const p = document.createElement('p');
    p.textContent = '結果較多，請輸入更完整的姓名。';
    list.appendChild(p);
  }
}

$('plan').appendChild(drawPlan(TABLES, null));

if (!window.SEATING) {
  $('out').innerHTML = '<div class="msg" role="alert">座位資料載入失敗，請連上網路後重新整理頁面。</div>';
} else if (window.SEATING.updated) {
  const d = new Date(window.SEATING.updated);
  if (!isNaN(d)) $('updated').textContent = '座位資料更新：' + d.toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
}

$('share').addEventListener('click', async () => {
  const url = location.origin + location.pathname;
  const btn = $('share');
  try {
    if (navigator.share) { await navigator.share({ title: document.title, url }); return; }
    await navigator.clipboard.writeText(url);
    btn.textContent = '已複製連結';
  } catch (err) {
    if (err && err.name === 'AbortError') return; // 使用者取消分享
    btn.textContent = url;
  }
  setTimeout(() => { btn.textContent = '分享此頁面'; }, 2500);
});

let timer = null, composing = false;
const input = $('q');
input.addEventListener('compositionstart', () => { composing = true; });
input.addEventListener('compositionend', () => { composing = false; schedule(); });
input.addEventListener('input', () => { if (!composing) schedule(); });
function schedule() { clearTimeout(timer); timer = setTimeout(() => run(false), 250); }
$('form').addEventListener('submit', ev => {
  ev.preventDefault();
  clearTimeout(timer);
  input.blur();
  run(true);
});

/* ----- PWA 離線快取 ----- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
      $('offline').textContent = '✓ 已完成離線準備，沒有網路也能查詢';
    }).catch(() => {});
  });
}
</script>
